# Push a tag like v5.9.0 -> builds ActionRecorder-v5.9.0.zip and publishes a GitHub release
# with that version's CHANGELOG.md section as the notes. The tag must match manifest.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip and notes
        run: bash scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/ActionRecorder-$GITHUB_REF_NAME.zip" \
            --title "Action Recorder $GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --verify-tag
