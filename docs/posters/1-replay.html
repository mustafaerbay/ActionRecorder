<!doctype html>
<!-- README poster 1 (hero, 1600×800): record once, replay with new values. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Action Recorder</title>
<link rel="stylesheet" href="poster.css">
<style>
  .headline { position: absolute; left: 90px; top: 150px; width: 860px; }
  .headline .h { font-size: 92px; }
  .headline .h em { font-size: 230px; margin: 4px 0 4px -6px; }
  .sub { margin-top: 30px; font-size: 30px; font-weight: 500; line-height: 1.3; max-width: 700px; }
  .sub b { font-weight: 800; }
  .brand { position: absolute; left: 90px; top: 60px; display: flex; gap: 18px; align-items: center; font-weight: 800; font-size: 28px; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .panel { width: 460px; height: 820px; left: 1010px; top: 70px; transform: rotate(-6deg) scale(1.08); }
  .vars { left: 850px; top: 430px; width: 430px; transform: rotate(4deg); font-size: 26px; }
  .vars .t { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 14px; }
  .vars .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px dashed rgba(0,0,0,.2); }
  .vars .k { color: #555; font-weight: 600; }
  .vars s { color: #999; font-weight: 600; margin-right: 10px; }
  .vars .v { color: var(--orange-deep); }
  .replay { right: 60px; top: 120px; transform: rotate(7deg); font-size: 44px; padding: 22px 40px; }
  .count { right: 40px; bottom: 36px; transform: rotate(-4deg); font-size: 30px; }
</style>
</head>
<body class="orange">
  <div class="headline">
    <div class="h">Record once.<em>Replay</em>with new values.</div>
    <p class="sub">Do a browser task once. Next time change <b>a name, a plan, a number</b> — and let it run.</p>
  </div>
  <div class="brand"><img src="../../icons/icon128.png" alt="">Action Recorder <span class="kicker" style="font-size:20px;margin-left:10px">Chrome extension · free</span></div>

  <iframe class="panel" src="panel.html?scene=rec"></iframe>

  <div class="pop card vars">
    <div class="t">Variables · this run</div>
    <div class="row"><span class="k">customer</span><span><s>Acme Ltd</s><span class="v">Globex</span></span></div>
    <div class="row"><span class="k">plan</span><span><s>Pro</s><span class="v">Team</span></span></div>
    <div class="row"><span class="k">seats</span><span><s>25</s><span class="v">40</span></span></div>
  </div>
  <div class="pop pill ink replay">▶ Replay</div>
  <div class="pop pill white count">7 steps · 0 clicks by you</div>
  <script src="ready.js"></script>
</body>
</html>
